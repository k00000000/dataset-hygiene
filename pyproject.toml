[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-hygiene"
version = "2.0.0"
description = "离线优先的 ML 数据集审计工具 / Offline-first ML dataset auditor (inventory, checksums, duplicates, manifests, diffs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xiaowei" }]
keywords = ["dataset", "ml", "data-quality", "duplicates", "checksum", "audit", "manifest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
images = ["Pillow>=10.0"]
toml = ["tomli>=2.0; python_version < '3.11'"]

[project.scripts]
dataset-hygiene = "dataset_hygiene.cli:main"

[project.urls]
Homepage = "https://github.com/k00000000/dataset-hygiene"
Issues = "https://github.com/k00000000/dataset-hygiene/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
